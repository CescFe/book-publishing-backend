name: Integration Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened, ready_for_review ]

jobs:
  validate-api-integration:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false

    env:
      POSTGRES_DB: root
      POSTGRES_USER: root
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_PORT: 5432
      POSTGRES_IMAGE_VERSION: postgres:16.3
      LIQUIBASE_IMAGE_VERSION: liquibase/liquibase:4.19.0

      SPRING_PROFILES_ACTIVE: local
      LOCAL_ADMIN_NAME: ${{secrets.LOCAL_ADMIN_NAME}}
      LOCAL_ADMIN_PASSWORD: ${{secrets.LOCAL_ADMIN_PASSWORD}}
      LOCAL_USER_NAME: ${{secrets.LOCAL_USER_NAME}}
      LOCAL_USER_PASSWORD: ${{secrets.LOCAL_USER_PASSWORD}}

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build application JAR
        run: ./gradlew bootJar

      - name: Start Docker services (Postgres + Liquibase)
        run: |
          docker compose up -d
          until [ "$(docker inspect -f '{{.State.Health.Status}}' postgres)" == "healthy" ]; do
            echo "Waiting for Postgres..."
            sleep 5
          done
          echo "Database ready!"

      - name: Start backend
        run: |
          nohup java -jar build/libs/*.jar > backend.log 2>&1 &

      - name: Wait backend
        run: |
          npx wait-on http://localhost:8080/api/v1/health

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - run: npm install -g newman wait-on

      - name: Run Postman tests
        run: |
          newman run postman/book-publishing-api-collection.json \
            -e postman/environments/local.postman_environment.json \

      - name: Stop backend
        if: always()
        run: pkill -f 'java -jar' || true

      - name: Stop Docker services
        if: always()
        run: docker compose down -v
