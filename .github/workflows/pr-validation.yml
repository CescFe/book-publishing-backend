name: PR Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      GITHUB_USERNAME: ${{ github.actor }}
      TOKEN_PAT: ${{ secrets.TOKEN_PAT }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run Spotless check
        run: ./gradlew spotlessCheck

      - name: Build application
        run: ./gradlew build

      - name: Run tests
        run: ./gradlew test

      - name: Test application startup (without DB)
        run: |
          timeout 20s ./gradlew bootRun --args='--spring.datasource.url=jdbc:h2:mem:testdb --spring.datasource.driver-class-name=org.h2.Driver --spring.jpa.database-platform=org.hibernate.dialect.H2Dialect' &
          APP_PID=$!

          sleep 15

          if kill -0 $APP_PID 2>/dev/null; then
            echo "✅ Application context loaded successfully!"
            kill $APP_PID
            exit 0
          else
            echo "❌ Application failed to start"
            exit 1
          fi
