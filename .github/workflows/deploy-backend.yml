name: Deploy Backend to pro

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/867321761184/locations/global/workloadIdentityPools/github-pool/providers/github
          service_account: github-ci@book-publishing-backend.iam.gserviceaccount.com

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Build image with Cloud Build
        run: |
          gcloud builds submit \
            --project book-publishing-backend \
            --region europe-west1

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy backend \
            --image europe-west1-docker.pkg.dev/book-publishing-backend/backend-repo/backend \
            --region europe-west1 \
            --platform managed \
            --allow-unauthenticated
