spring:
  application:
    name: book-publishing-backend
  profiles:
    active: local
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:root}
    username: ${POSTGRES_USER:root}
    password: ${POSTGRES_PASSWORD:root}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: false

auth:
  users:
    - username: ${ADMIN_NAME}
      password: ${ADMIN_PASSWORD}
      roles:
        - ADMIN
        - USER
    - username: ${MANAGER_NAME}
      password: ${MANAGER_PASSWORD}
      roles:
        - MANAGER
        - USER
    - username: ${USER_NAME}
      password: ${USER_PASSWORD}
      roles:
        - USER

jwt:
  secret: ${JWT_SECRET:mySecretKeyThatIsAtLeast32CharactersLong}
  expiration: ${JWT_EXPIRATION:900}

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    org.cescfe.bookpublishing: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: INFO
    org.hibernate.type.descriptor.sql.BasicBinder: INFO
