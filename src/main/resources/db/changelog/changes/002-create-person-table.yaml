databaseChangeLog:
  - changeSet:
      id: create-person-table
      author: francesc
      changes:
        - createTable:
            tableName: person
            schemaName: publishing
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: full_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: pseudonym
                  type: VARCHAR(255)
              - column:
                  name: biography
                  type: VARCHAR(2000)
              - column:
                  name: email
                  type: VARCHAR(255)
              - column:
                  name: website
                  type: VARCHAR(500)
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
                  defaultValueComputed: CURRENT_TIMESTAMP
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
                  defaultValueComputed: CURRENT_TIMESTAMP
              - column:
                  name: created_by
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                  defaultValue: "system"
              - column:
                  name: updated_by
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                  defaultValue: "system"
        - addUniqueConstraint:
            tableName: person
            schemaName: publishing
            columnNames: email
            constraintName: uk_person_email
        - createIndex:
            tableName: person
            schemaName: publishing
            indexName: idx_person_email
            columns:
              - column:
                  name: email
