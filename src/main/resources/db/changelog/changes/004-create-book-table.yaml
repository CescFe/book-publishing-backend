databaseChangeLog:
  - changeSet:
      id: create-book-table
      author: francesc
      changes:
        - createTable:
            tableName: book
            schemaName: publishing
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: title
                  type: VARCHAR(200)
                  constraints:
                    nullable: false
              - column:
                  name: author_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: collection_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: base_price
                  type: NUMERIC(10, 2)
                  constraints:
                    nullable: false
              - column:
                  name: vat_rate
                  type: NUMERIC(3, 2)
              - column:
                  name: final_price
                  type: NUMERIC(10, 2)
                  constraints:
                    nullable: false
              - column:
                  name: isbn
                  type: VARCHAR(13)
              - column:
                  name: publication_date
                  type: DATE
              - column:
                  name: page_count
                  type: INTEGER
              - column:
                  name: cover_image_path
                  type: VARCHAR(255)
              - column:
                  name: description
                  type: VARCHAR(2000)
              - column:
                  name: reading_level
                  type: VARCHAR(20)
              - column:
                  name: primary_language
                  type: VARCHAR(20)
              - column:
                  name: secondary_languages
                  type: VARCHAR(20) ARRAY
              - column:
                  name: primary_genre
                  type: VARCHAR(50)
              - column:
                  name: secondary_genres
                  type: VARCHAR(50) ARRAY
              - column:
                  name: status
                  type: VARCHAR(20)
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
                  defaultValueComputed: CURRENT_TIMESTAMP
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
                  defaultValueComputed: CURRENT_TIMESTAMP
              - column:
                  name: created_by
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                  defaultValue: "system"
              - column:
                  name: updated_by
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                  defaultValue: "system"
        - addForeignKeyConstraint:
            baseTableName: book
            baseTableSchemaName: publishing
            baseColumnNames: author_id
            referencedTableName: author
            referencedTableSchemaName: publishing
            referencedColumnNames: id
            constraintName: fk_book_author
        - addForeignKeyConstraint:
            baseTableName: book
            baseTableSchemaName: publishing
            baseColumnNames: collection_id
            referencedTableName: collection
            referencedTableSchemaName: publishing
            referencedColumnNames: id
            constraintName: fk_book_collection
        - createIndex:
            tableName: book
            schemaName: publishing
            indexName: idx_book_title
            columns:
              - column:
                  name: title
        - createIndex:
            tableName: book
            schemaName: publishing
            indexName: idx_book_author_id
            columns:
              - column:
                  name: author_id
        - createIndex:
            tableName: book
            schemaName: publishing
            indexName: idx_book_collection_id
            columns:
              - column:
                  name: collection_id
        - createIndex:
            tableName: book
            schemaName: publishing
            indexName: idx_book_isbn
            columns:
              - column:
                  name: isbn
            unique: true
        - sql:
            sql: CREATE INDEX idx_book_secondary_languages ON publishing.book USING GIN (secondary_languages)
        - sql:
            sql: CREATE INDEX idx_book_secondary_genres ON publishing.book USING GIN (secondary_genres)
