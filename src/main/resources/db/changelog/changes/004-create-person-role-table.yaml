databaseChangeLog:
  - changeSet:
      id: create-person-role-table
      author: francesc
      changes:
        - createTable:
            tableName: person_role
            schemaName: publishing
            columns:
              - column:
                  name: person_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: role_id
                  type: BIGINT
                  constraints:
                    nullable: false
        - addPrimaryKey:
            tableName: person_role
            schemaName: publishing
            columnNames: person_id, role_id
        - addForeignKeyConstraint:
            baseTableName: person_role
            baseTableSchemaName: publishing
            constraintName: fk_person_role_person
            referencedTableName: person
            referencedTableSchemaName: publishing
            baseColumnNames: person_id
            referencedColumnNames: id
        - addForeignKeyConstraint:
            baseTableName: person_role
            baseTableSchemaName: publishing
            constraintName: fk_person_role_role
            referencedTableName: role
            referencedTableSchemaName: publishing
            baseColumnNames: role_id
            referencedColumnNames: id
