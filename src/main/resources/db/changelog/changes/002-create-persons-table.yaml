databaseChangeLog:
  - changeSet:
      id: create-persons-table
      author: francesc
      changes:
        - createTable:
            tableName: publishing.persons
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
                    primaryKeyName: pk_person
              - column:
                  name: full_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: pseudonym
                  type: VARCHAR(255)
              - column:
                  name: biography
                  type: TEXT
              - column:
                  name: email
                  type: VARCHAR(255)
              - column:
                  name: website
                  type: VARCHAR(500)
              - column:
                  name: roles
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    remarks: Comma-separated list of roles (AUTHOR,ILLUSTRATOR,TRANSLATOR,CURATOR)
              - column:
                  name: version
                  type: BIGINT
                  constraints:
                    nullable: false
                    default: 0
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
                    default: CURRENT_TIMESTAMP
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
                    default: CURRENT_TIMESTAMP
        - addUniqueConstraint:
            tableName: publishing.persons
            columnNames: email
            constraintName: uk_person_email
        - addCheckConstraint:
            tableName: publishing.persons
            constraintName: ck_person_roles_not_empty
            checkCondition: "roles IS NOT NULL AND LENGTH(TRIM(roles)) > 0"
        - addCheckConstraint:
            tableName: publishing.persons
            constraintName: ck_person_roles_contains_author
            checkCondition: "roles LIKE '%AUTHOR%'"
        - createIndex:
            tableName: publishing.persons
            indexName: idx_person_roles
            columns:
              - column:
                  name: roles
                  type: VARCHAR(255)
        - createIndex:
            tableName: publishing.persons
            indexName: idx_person_email
            columns:
              - column:
                  name: email
                  type: VARCHAR(255)
