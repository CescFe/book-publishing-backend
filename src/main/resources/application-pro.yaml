spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/${DB_NAME:book_publishing} # TODO
    username: ${DB_USER:book_user} # TODO
    password: ${DB_PASSWORD:book_password} # TODO
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

logging:
  level:
    org.cescfe.bookpublishing: INFO
    org.springframework.web: INFO
