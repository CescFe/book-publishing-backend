spring:
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:root}
    username: ${POSTGRES_USER:root}
    password: ${POSTGRES_PASSWORD:root}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: false

auth:
  users:
    - username: ${LOCAL_ADMIN_NAME:admin@example.com}
      password: ${LOCAL_ADMIN_PASSWORD:admin123}
      roles:
        - ADMIN
    - username: ${LOCAL_MANAGER_NAME:manager@example.com}
      password: ${LOCAL_MANAGER_PASSWORD:manager123}
      roles:
        - MANAGER
    - username: ${LOCAL_USER_NAME:user@example.com}
      password: ${LOCAL_USER_PASSWORD:user123}
      roles:
        - USER

jwt:
  secret: ${JWT_SECRET:mySecretKeyThatIsAtLeast32CharactersLong}
  expiration: ${JWT_EXPIRATION:900}

logging:
  level:
    org.cescfe.bookpublishing: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
